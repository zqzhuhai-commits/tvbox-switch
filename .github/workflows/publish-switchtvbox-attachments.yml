name: Publish SwitchTVBox release attachments
on:
  push:
    branches: [main]
    paths:
      - "release-payload/switchtvbox/**"
      - "scripts/restore-release-attachments.py"
      - "docs/SwitchTVBox-attachments.md"
      - ".github/workflows/publish-switchtvbox-attachments.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: switchtvbox-release-attachments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify original attachments
        run: python3 scripts/restore-release-attachments.py
      - name: Upload attachments and publish formal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view SwitchTVBox --json body --jq '.body' > /tmp/switchtvbox-release-notes.md
          if ! grep -q '^## 项目参考与补充下载' /tmp/switchtvbox-release-notes.md; then
            printf '\n\n' >> /tmp/switchtvbox-release-notes.md
            cat docs/SwitchTVBox-attachments.md >> /tmp/switchtvbox-release-notes.md
          fi
          gh api --method PATCH repos/"$GH_REPO"/releases/assets/642492269 -f name=SwitchTVBox.nsp > /dev/null
          old_nro_id=$(gh api repos/"$GH_REPO"/releases/413380053/assets --jq '.[] | select(.name == "SwitchTVBox.1.nro") | .id')
          if [ -n "$old_nro_id" ]; then
            gh api --method PATCH repos/"$GH_REPO"/releases/assets/"$old_nro_id" -f name=SwitchTVBox.nro > /dev/null
          fi
          python3 -c 'from pathlib import Path; p=Path("/tmp/switchtvbox-release-notes.md"); s=p.read_text(); s=s.replace("SwitchTVBox-05243035FF755000-v0.nsp","SwitchTVBox.nsp").replace("SwitchTVBox(1).nro","SwitchTVBox.nro").replace("SwitchTVBox.1.nro","SwitchTVBox.nro"); p.write_text(s)'
          gh release upload SwitchTVBox dist/SwitchTvbox.zip 'dist/SwitchTVBox.nro' --clobber
          gh release edit SwitchTVBox --draft=false --prerelease=false --latest --notes-file /tmp/switchtvbox-release-notes.md
